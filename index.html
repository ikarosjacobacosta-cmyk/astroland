<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROLAND - Acceso Sucursales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 1000px; width: 100%; border: 1px solid #eaeaea; }
        h1 { text-align: center; margin-bottom: 5px; font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 700; font-family: 'Times New Roman', serif; letter-spacing: 2px; }
        .letter-a1 { color: #b22222; } .letter-s { color: #2e5c4b; } .letter-t { color: #5d3a1a; } .letter-r { color: #4a6c8f; } .letter-o { color: #8b5a2b; } .letter-l { color: #6b4e3a; } .letter-a2 { color: #8b3a3a; } .letter-n { color: #3a5f5f; } .letter-d { color: #7a4d4d; }
        .subtitle { text-align: center; color: #000; margin-bottom: 30px; font-size: clamp(1.2rem, 4vw, 1.5rem); font-weight: bold; letter-spacing: 2px; font-family: 'Times New Roman', serif; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        .info-badge { background: #f5f5f5; color: #333; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 30px; font-size: 1rem; border-left: 4px solid #b22222; border-right: 4px solid #b22222; }
        .sucursales-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; margin-top: 20px; }
        .sucursal-card { background: #fff; border-radius: 12px; padding: 30px 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; border: 2px solid #eaeaea; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: block; }
        .sucursal-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: #b22222; }
        .sucursal-icon { font-size: 2.2rem; margin-bottom: 10px; color: #b22222; opacity: 0.8; }
        .sucursal-icon::before { content: "⚜️"; }
        .sucursal-card h3 { color: #333; margin-bottom: 8px; font-size: 1.3rem; font-weight: 600; }
        .direccion { color: #666; font-size: 0.85rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; font-style: italic; }
        .footer { text-align: center; margin-top: 40px; color: #888; font-size: 0.9rem; border-top: 1px solid #eaeaea; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="letter-a1">A</span><span class="letter-s">S</span><span class="letter-t">T</span><span class="letter-r">R</span><span class="letter-o">O</span><span class="letter-l">L</span><span class="letter-a2">A</span><span class="letter-n">N</span><span class="letter-d">D</span>
        </h1>
        <div class="subtitle">IN GOD WE TRUST</div>
        <div class="info-badge">🏢 Selecciona tu sucursal para ingresar</div>
        <div class="sucursales-grid">
            <a href="sucursales/villa-morra.html" class="sucursal-card">
                <div class="sucursal-icon"></div>
                <h3>Villa Morra</h3>
                <p class="direccion">Av. Mariscal López</p>
            </a>
            <a href="sucursales/los-laureles.html" class="sucursal-card">
                <div class="sucursal-icon"></div>
                <h3>Los Laureles</h3>
                <p class="direccion">Av. RI 18 Pitiantuta</p>
            </a>
            <a href="sucursales/lambare.html" class="sucursal-card">
                <div class="sucursal-icon"></div>
                <h3>Lambare</h3>
                <p class="direccion">Av. Juan Domingo Perón</p>
            </a>
            <a href="sucursales/villa-elisa.html" class="sucursal-card">
                <div class="sucursal-icon"></div>
                <h3>Villa Elisa</h3>
                <p class="direccion">Av. Von Poleski</p>
            </a>
        </div>
        <div class="footer">
            <p>© 2026 ASTROLAND - Todos los derechos reservados</p>
        </div>
    </div>
</body>
</html>
